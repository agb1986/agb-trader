[project]
name = "agb-trader"
version = "0.1.0"
description = "Semi-autonomous, AI-integrated US equities trader"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Base dependencies: everything the `base` image target installs. Shared by the
# live services and the research profile, so both import the same definitions.
dependencies = [
    "anthropic>=1.8.0",
    "duckdb>=1.5.5",
    "exchange-calendars>=4.13.2",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "zstandard>=0.25.0",
]

[project.scripts]
agb = "agb.cli:main"

[dependency-groups]
# Server services only (the `app` image target). The pipeline ranks with the promoted
# certification's LightGBM booster.
app = [
    "lightgbm>=4.7.0",
]
# Workstation research only (the `research` image target).
research = [
    "lightgbm>=4.7.0",
    "nautilus-trader>=1.200",
    "pandas>=3.0.5",
    "plotly<7",
    "vectorbt>=1.1.0",
]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.7",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv]
# A plain `uv sync` installs every group, so workers and tests see all code paths.
default-groups = ["app", "research", "dev"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is agb-trader; the import package is agb.
module-name = "agb"

[tool.pytest.ini_options]
testpaths = ["tests"]
# A live test runs only when asked for with `-m live` (make test-live): a later -m replaces
# this one, so a target that passes its own -m must keep "not live" in it.
addopts = "-ra --strict-markers -m 'not live'"
# Seconds per test, setup and teardown included (pytest-timeout). The slowest tests in the fast
# suite, the certification tests that build a research panel, took 54 s on a loaded machine; this
# is five times that. A test that needs longer takes @pytest.mark.timeout(n) and says why.
timeout = 300
markers = [
    "stack: brings up the Compose stack (builds the app image)",
    "live: needs the real vendor API or the real lake; each module names the variable that enables it",
]

[tool.coverage.run]
source = ["agb"]

[tool.coverage.report]
# The coverage floor, recorded here and nowhere else (`make cover` fails below it). The fast
# suite measured 94.3% on 2026-11-16; the floor sits a little under that. Raise it when
# coverage rises; do not lower it to make a change pass.
fail_under = 92
show_missing = false

[tool.ruff]
line-length = 100
target-version = "py312"
# The Orca coordinator script predates these settings and is not part of the product.
extend-exclude = ["scripts/orca"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "PTH", "RET", "DTZ", "PL"]
# Rules switched off for the whole tree, each because fixing it is a wide edit across src (many
# modules are being changed in parallel) or because the rule is wrong for this code. A finding
# the rule would still catch elsewhere stays caught; shrink this list, do not grow it.
ignore = [
    "S101",     # assert: src uses it to narrow types for mypy and to state invariants; tests are all asserts
    "PLR2004",  # magic values: thresholds, tolerances and counts read better inline than as constants
    "PLR0913",  # too many arguments: keyword-only parameter lists on job and gate functions
    "PLR0917",  # too many positional arguments: same signatures as PLR0913
    "PLR0911",  # too many returns: early-return guards in gate and approval logic
    "PLR0912",  # too many branches: the gate checks, one branch per rule
    "PLR0915",  # too many statements: CLI and report builders
    "PLC0415",  # import outside top level: deliberate lazy imports of heavy research dependencies
    "S608",     # SQL built by string: identifiers come from constants, values are always bound
    "S603",     # subprocess call: argument lists, never shell=True; the inputs are our own commands
    "S607",     # partial executable path: docker, git and uv are resolved from PATH on purpose
    "PLW1510",  # subprocess.run without check: callers read the return code themselves
    "S310",     # urlopen scheme audit: every URL is a fixed https vendor endpoint
    "S105",     # hardcoded password: false positive on token names and test fixtures
    "PTH123",   # open() in lake.py: the Path rewrite touches a module others are editing
    "PTH105",   # os.replace in four modules: the Path rewrite touches modules others are editing
    "PLW2901",  # loop variable overwritten: deliberate normalising in two loops
    "PLR0124",  # volume == volume: the NaN check, written that way on purpose
    "PLC0414",  # redundant import alias: an explicit re-export in registry.py
    "PLE2515",  # zero-width space in edgar.py is the character being matched
    "RET504",   # assign before return: kept for readability in one gate helper
    "SIM102",   # nested if in killswitch.py reads clearer than the merged condition
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, build throwaway data with a seeded generator, use fixture secrets and tmp paths,
# bind test servers to all interfaces, and nest `with` blocks for patches.
"tests/**" = [
    "S104", "S108", "S311", "SIM117", "SIM300", "PTH119", "DTZ011",
]

# The type checker (#192). `make types` checks the package; the four modules that move money and
# state are held to `strict`, and every other module is checked permissively, so it still has
# to import and type-check at the level a plain `mypy` reads, but may leave functions
# unannotated. See docs/build/type-checking.md for the permissive list, which only shrinks.
[tool.mypy]
python_version = "3.12"
files = ["src/agb"]
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "agb.approval",
    "agb.execution",
    "agb.gate",
    "agb.jobs",
]
# `strict` itself is a global-only switch; these are the flags it stands for.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# The permissive list: modules that do not yet pass a plain check (97 errors on 2026-11-16,
# counted per module in docs/build/type-checking.md). Their errors are not reported, and every
# other module is checked at the permissive level. Fix a module, delete its line here, and run
# `make types`; the list only shrinks.
[[tool.mypy.overrides]]
module = [
    "agb.basket",
    "agb.cli",
    "agb.features",
    "agb.health",
    "agb.heartbeat",
    "agb.lake",
    "agb.migrate",
    "agb.panel",
    "agb.panel_audit",
    "agb.preflight",
    "agb.readout",
    "agb.recovery",
    "agb.registry",
    "agb.research.__main__",
    "agb.research.artifact",
    "agb.research.backtest",
    "agb.research.certify",
    "agb.research.cpcv",
    "agb.research.reproduce",
    "agb.research.trials",
    "agb.schedule",
    "agb.services.backup",
    "agb.services.bot",
    "agb.services.execution",
    "agb.services.pipeline",
    "agb.services.ui",
    "agb.ui",
    "agb.universe",
]
ignore_errors = true
