# The agb-trader stack. `make up` brings it up with the real env files:
#   docker compose --env-file env/db.env up --build --detach --wait
# On the server, `agb-stack` runs it from the deploy directory with the shipped image instead
# (docs/build/deploy.md).
#
# Conventions, checked by tests/test_compose.py:
#   - Every long-running service sets `restart: unless-stopped`. The only one-shots are
#     `migrate`, `cli`, `certification-import`, `reconcile` and `research`.
#   - Every service sets an explicit `mem_limit` and `pids_limit`.
#   - Every service drops every Linux capability and sets `no-new-privileges`. Only `vpn` adds
#     any back: NET_ADMIN for its tunnel and firewall, CHOWN and DAC_OVERRIDE for the files its
#     entrypoint prepares as root.
#   - Every service but `vpn` has a read-only root filesystem, writing only to its volumes and to
#     a `/tmp` held in memory. gluetun creates its user in /etc/passwd at each start, so `vpn`
#     cannot be read-only.
#   - The stock images, `db` and `vpn`, are pinned by digest as well as tag, as the Dockerfile's
#     base images are. The server pulls exactly that digest; moving a tag changes nothing until
#     the digest here is changed too (docs/build/deploy.md).
#   - Every service declares a healthcheck. Each long-running app service checks its own
#     heartbeat's age (`python -m agb.heartbeat`), so `up --wait` only passes once every service
#     is beating; db and vpn check themselves; the one-shots disable it and are judged by their
#     exit status. Only fields Docker Engine 20.10 knows are used: no `start_interval`.
#   - The Compose plugin must be v2.20 or newer (docs/build/deploy.md): the file uses the
#     top-level `name`, `depends_on` conditions and, through agb-stack, `up --wait-timeout`.
#   - No service mounts the Docker socket, and `db` publishes no host port.
#   - `core` is internal. Only `pipeline`, `execution` and `reconcile` join `outbound`, the
#     network with a route to the internet; `ui` joins `ui-port` for its published port alone.
#   - No `container_name`, so several copies of the stack can run side by side under
#     different project names.
#   - Each service's block stays contiguous; shared settings live in the x- anchors below.
#   - `research` runs only on the workstation, under its own profile, from its own image
#     target. deploy.sh never builds that target or ships its env file, and agb-stack never
#     enables its profile.
#
# The database is the only channel between services. Each service connects as its own role,
# and Compose interpolates only that role's password into its container from env/db.env.

name: agb-trader

x-app-image: &app-image
  image: ${AGB_IMAGE:-agb-trader-app}:${AGB_IMAGE_TAG:-dev}

# Healthy while the row of the role the service connects as is younger than
# AGB_STALE_AFTER_SECONDS (default five minutes). The first probe runs one interval after the
# container starts, and a restart starts the count again, so a service that dies inside its
# first interval never turns healthy.
x-heartbeat-check: &heartbeat-check
  test: ["CMD", "python", "-m", "agb.heartbeat"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

# The one-shots finish or fail; their exit status is what Compose waits on.
x-no-healthcheck: &no-healthcheck
  disable: true

# The hardening every service shares: no Linux capabilities, no privilege gained through a
# setuid binary, and a root filesystem nothing can write, so code and configuration in the image
# cannot be changed at run time. /tmp is a tmpfs, counted against the service's memory. `db`
# adds its socket directory; `vpn` spells out its own, since it is not read-only.
x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-pg: &pg
  PGHOST: db
  PGDATABASE: agb
  PGTZ: UTC

services:
  # It runs as the image's postgres user (uid 70) from the start, rather than as root dropping
  # to it, so the entrypoint has no ownership to fix and needs no capability. The data
  # directory is already that user's: the entrypoint made it so when it first initialised it.
  db:
    <<: *hardened
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: postgres
    tmpfs: [/tmp, /var/run/postgresql]
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_DB: agb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in env/db.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [core]
    healthcheck:
      test: ["CMD", "pg_isready", "--username=postgres", "--dbname=agb"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 160m
    pids_limit: 128

  # One-shot: creates the roles and applies migrations, then exits. Every service waits for it.
  migrate:
    <<: [*app-image, *hardened]
    build:
      context: .
      target: app
      args:
        AGB_VERSION: ${AGB_IMAGE_TAG:-dev}
    command: ["python", "-m", "agb.migrate"]
    environment:
      <<: *pg
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in env/db.env}
      AGB_OWNER_PASSWORD: ${AGB_OWNER_PASSWORD:?set in env/db.env}
      # Set to 1 on the command line to apply a migration older than the newest applied one.
      AGB_MIGRATE_ALLOW_OUT_OF_ORDER: ${AGB_MIGRATE_ALLOW_OUT_OF_ORDER:-}
      SCHEDULER_DB_PASSWORD: ${SCHEDULER_DB_PASSWORD:?set in env/db.env}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD:?set in env/db.env}
      EXECUTION_DB_PASSWORD: ${EXECUTION_DB_PASSWORD:?set in env/db.env}
      BOT_DB_PASSWORD: ${BOT_DB_PASSWORD:?set in env/db.env}
      UI_DB_PASSWORD: ${UI_DB_PASSWORD:?set in env/db.env}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?set in env/db.env}
      CLI_DB_PASSWORD: ${CLI_DB_PASSWORD:?set in env/db.env}
      RESEARCH_DB_PASSWORD: ${RESEARCH_DB_PASSWORD:?set in env/db.env}
    depends_on:
      db:
        condition: service_healthy
    networks: [core]
    restart: "no"
    healthcheck: *no-healthcheck
    mem_limit: 256m
    pids_limit: 64

  scheduler:
    <<: [*app-image, *hardened]
    command: ["python", "-m", "agb.services.scheduler"]
    environment:
      <<: *pg
      PGUSER: scheduler
      PGPASSWORD: ${SCHEDULER_DB_PASSWORD:?set in env/db.env}
      AGB_HEARTBEAT_SECONDS: ${AGB_HEARTBEAT_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [core]
    restart: unless-stopped
    healthcheck: *heartbeat-check
    mem_limit: 192m
    pids_limit: 64

  # The local UI: server-rendered pages over the database, read-only. It publishes on the
  # loopback address alone, so nothing on the network reaches it; the operator views it through
  # an SSH tunnel (`ssh -L 8080:127.0.0.1:8080 casaos.local`), and SSH is the authentication.
  # It holds no broker keys and no Telegram token, and it has no route to the internet: a page
  # that cannot reach the internet cannot leak the book to it. It reads the database on core,
  # which is internal, and the publication needs a network that is not, so it is also on
  # ui-port, whose bridge translates no address (see the networks at the end of this file).
  ui:
    <<: [*app-image, *hardened]
    command: ["python", "-m", "agb.services.ui"]
    environment:
      <<: *pg
      PGUSER: ui
      PGPASSWORD: ${UI_DB_PASSWORD:?set in env/db.env}
      AGB_HEARTBEAT_SECONDS: ${AGB_HEARTBEAT_SECONDS:-30}
      # Every interface of this container, which is only reachable through the publication
      # below: the host's loopback address. A loopback bind here would answer nothing, since
      # the published port arrives on the container's own address.
      AGB_UI_HOST: 0.0.0.0
      AGB_UI_ALLOWED_HOSTS: ${AGB_UI_ALLOWED_HOSTS:-}
    ports:
      - "127.0.0.1:${AGB_UI_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [core, ui-port]
    restart: unless-stopped
    # The heartbeat loop runs beside the HTTP server's thread, so the UI's check also asks the
    # server itself. HEAD / answers from the routing table without reading the database, which
    # the heartbeat half has already shown is reachable. The UI refuses a Host it does not know
    # with a 421, so the check sends the first name in AGB_UI_ALLOWED_HOSTS when that is set,
    # and the URL's own, 127.0.0.1:8080, one of the default names, when it is not.
    healthcheck:
      <<: *heartbeat-check
      test: ["CMD", "python", "-m", "agb.heartbeat", "http://127.0.0.1:8080/"]
    mem_limit: 192m
    pids_limit: 128

  # Takes the scheduler's nightly backup job, writes a dated pg_dump into the backup
  # directory, and copies the panel store's new bodies into backups/panel/. It runs as the host
  # user that owns that directory, so the dumps belong to the operator: `make up` and
  # `agb-stack` both set AGB_BACKUP_USER to the caller's uid:gid. The panel bodies are mode
  # 0600, so it must be the pipeline's user too, which both also set it to. It only reads the
  # panel store.
  backup:
    <<: [*app-image, *hardened]
    command: ["python", "-m", "agb.services.backup"]
    user: "${AGB_BACKUP_USER:-agb}"
    environment:
      <<: *pg
      PGUSER: backup
      PGPASSWORD: ${BACKUP_DB_PASSWORD:?set in env/db.env}
      AGB_HEARTBEAT_SECONDS: ${AGB_HEARTBEAT_SECONDS:-30}
      AGB_BACKUP_DIR: /backups
      AGB_BACKUP_KEEP: ${AGB_BACKUP_KEEP:-14}
      AGB_PANEL_DIR: /panel
    volumes:
      - ${AGB_BACKUP_DIR:-./backups}:/backups
      - ${AGB_PANEL_DIR:-./panel}:/panel:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [core]
    restart: unless-stopped
    healthcheck: *heartbeat-check
    mem_limit: 160m
    pids_limit: 64

  # agb-trader's own VPN tunnel: ProtonVPN over WireGuard, with no port forwarding. It exists
  # to give the bot an HTTP proxy on port 8888 whose traffic leaves only through the tunnel;
  # gluetun's firewall drops anything else. It is not on core and publishes nothing.
  #
  # vpn and bot are in the `telegram` profile. The server's agb-stack enables it; `make up`
  # leaves both out unless COMPOSE_PROFILES=telegram, because only one process may poll a bot
  # token at a time, and the server's bot is the one that should hold it. The workstation can
  # run the profile for a live check, with the server's bot stopped first.
  #
  # gluetun's entrypoint runs as root and writes its own files, so the capabilities it keeps are
  # NET_ADMIN, for the tunnel and the firewall, and CHOWN and DAC_OVERRIDE, without which it
  # cannot write or hand over the files under /tmp/gluetun.
  vpn:
    image: qmcgaw/gluetun:v3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    profiles: [telegram]
    env_file: ${AGB_ENV_DIR:-env}/vpn.env
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    devices: ["/dev/net/tun:/dev/net/tun"]
    networks: [egress]
    restart: unless-stopped
    # gluetun's own check, which its image declares too, spelled out here so that every
    # service's healthcheck is in this file.
    healthcheck:
      test: ["CMD-SHELL", "/gluetun-entrypoint healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 384m
    pids_limit: 128

  # The Telegram bot, the only service on both networks: it reads the database on core and
  # reaches Telegram through the vpn's proxy on egress. bot.env holds the Telegram token, and
  # no other service reads it.
  bot:
    <<: [*app-image, *hardened]
    profiles: [telegram]
    command: ["python", "-m", "agb.services.bot"]
    env_file: ${AGB_ENV_DIR:-env}/bot.env
    environment:
      <<: *pg
      PGUSER: bot
      PGPASSWORD: ${BOT_DB_PASSWORD:?set in env/db.env}
      AGB_HEARTBEAT_SECONDS: ${AGB_HEARTBEAT_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
      vpn:
        condition: service_healthy
    networks: [core, egress]
    restart: unless-stopped
    healthcheck: *heartbeat-check
    mem_limit: 192m
    pids_limit: 64

  # Takes the scheduler's data_pull job for each session and lands Sharadar's SEP, SF1 and
  # TICKERS in the Parquet lake. It is the only service that holds the Sharadar key, which
  # comes from env/pipeline.env, and it reaches the vendor directly, through outbound, as it does
  # the panel's other outside services. It runs as the host user that owns the lake directory:
  # `make up` and `agb-stack` set AGB_PIPELINE_USER to the caller's uid:gid.
  # `python -m agb.lake "SQL"` inside it queries the lake with DuckDB.
  # The panel store, the content-addressed bodies behind the panel's database rows, sits
  # beside the lake on the same data disk. Each rebalance ranks with the promoted
  # certification's artifact under /models, which it only reads.
  pipeline:
    <<: [*app-image, *hardened]
    command: ["python", "-m", "agb.services.pipeline"]
    user: "${AGB_PIPELINE_USER:-agb}"
    env_file: ["${AGB_ENV_DIR:-env}/pipeline.env"]
    environment:
      <<: *pg
      PGUSER: pipeline
      PGPASSWORD: ${PIPELINE_DB_PASSWORD:?set in env/db.env}
      AGB_HEARTBEAT_SECONDS: ${AGB_HEARTBEAT_SECONDS:-30}
      AGB_LAKE_DIR: /lake
      AGB_PANEL_DIR: /panel
      AGB_MODELS_DIR: /models
    volumes:
      - ${AGB_LAKE_DIR:-./lake}:/lake
      - ${AGB_PANEL_DIR:-./panel}:/panel
      - ${AGB_MODELS_DIR:-./models}:/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [core, outbound]
    restart: unless-stopped
    healthcheck: *heartbeat-check
    mem_limit: 2176m
    pids_limit: 256

  # Execution: the only service with broker keys. It submits the approved basket's
  # market-on-close orders and reads the fills back. No lake, no proxy: it talks to the
  # broker directly, through outbound.
  execution:
    <<: [*app-image, *hardened]
    command: ["python", "-m", "agb.services.execution"]
    env_file: ["${AGB_ENV_DIR:-env}/execution.env"]
    environment:
      <<: *pg
      PGUSER: execution
      PGPASSWORD: ${EXECUTION_DB_PASSWORD:?set in env/db.env}
      AGB_HEARTBEAT_SECONDS: ${AGB_HEARTBEAT_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [core, outbound]
    restart: unless-stopped
    healthcheck: *heartbeat-check
    mem_limit: 192m
    pids_limit: 64

  # The operator CLI: `make status`, or `make agb CMD="..."`. `agb promote` verifies the
  # certified artifact under /models before it makes the model live.
  cli:
    <<: [*app-image, *hardened]
    profiles: [cli]
    entrypoint: ["agb"]
    command: ["status"]
    environment:
      <<: *pg
      PGUSER: cli
      PGPASSWORD: ${CLI_DB_PASSWORD:?set in env/db.env}
      AGB_MODELS_DIR: /models
      # Who `agb status` insists is beating; empty means every service. `make status` leaves
      # the bot out unless the telegram profile runs.
      AGB_EXPECTED_SERVICES: ${AGB_EXPECTED_SERVICES:-}
      # How old a heartbeat may be before `agb status` calls it stale; empty means five minutes.
      AGB_STALE_AFTER_SECONDS: ${AGB_STALE_AFTER_SECONDS:-}
    volumes:
      - ${AGB_MODELS_DIR:-./models}:/models:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [core]
    restart: "no"
    healthcheck: *no-healthcheck
    mem_limit: 256m
    pids_limit: 64

  # The one service that runs as `research`: recording a certification is the research
  # profile's only write to this database, and only that role may insert into
  # agb.model_certification. It reads the artifact from /models, where the operator has copied
  # it, and writes nothing else. Everything else the research profile does runs on the
  # workstation, in the `research` service below, which has no network at all.
  certification-import:
    <<: [*app-image, *hardened]
    profiles: [cli]
    entrypoint: ["agb", "import-certification"]
    environment:
      <<: *pg
      PGUSER: research
      PGPASSWORD: ${RESEARCH_DB_PASSWORD:?set in env/db.env}
      AGB_MODELS_DIR: /models
    volumes:
      - ${AGB_MODELS_DIR:-./models}:/models:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [core]
    restart: "no"
    healthcheck: *no-healthcheck
    mem_limit: 256m
    pids_limit: 64

  # `make reconcile REF=2026-10`, after a submission died mid-flight. It asks the broker what
  # it knows about each of the basket's orders by client_order_id and appends what it learns.
  # It runs as `execution` because that is the role holding the broker's keys and the one that
  # owns the order events; the `cli` service is never given those keys. Like `execution`, it
  # reaches the broker through outbound.
  reconcile:
    <<: [*app-image, *hardened]
    profiles: [cli]
    entrypoint: ["agb", "reconcile"]
    env_file: ["${AGB_ENV_DIR:-env}/execution.env"]
    environment:
      <<: *pg
      PGUSER: execution
      PGPASSWORD: ${EXECUTION_DB_PASSWORD:?set in env/db.env}
    depends_on:
      db:
        condition: service_healthy
    networks: [core, outbound]
    restart: "no"
    healthcheck: *no-healthcheck
    mem_limit: 256m
    pids_limit: 64

  # Workstation research: `make research CMD="cpcv"`. It reads a lake `make sync-lake` has
  # pulled from the server and writes only its trial ledger and models under /research. It has
  # no network at all: the workstation never pulls from the vendor, and the rsync that fetches
  # the lake runs on the host, where the operator's SSH configuration lives.
  research:
    <<: *hardened
    image: ${AGB_RESEARCH_IMAGE:-agb-trader-research}:${AGB_IMAGE_TAG:-dev}
    build:
      context: .
      target: research
      # `make research` sets it to the checkout's commit. Built without it the image reports
      # `dev`, under which `certify` refuses to run. The app image takes its version from
      # AGB_IMAGE_TAG instead (the release tag); both default to `dev`, as the Dockerfile does.
      args:
        AGB_VERSION: ${AGB_VERSION:-dev}
    profiles: [research]
    entrypoint: ["python", "-m", "agb.research"]
    command: ["trials"]
    user: "${AGB_RESEARCH_USER:-agb}"
    env_file: ["${AGB_ENV_DIR:-env}/research.env"]
    environment:
      AGB_LAKE_DIR: /lake
      AGB_RESEARCH_DIR: /research
    volumes:
      - ${AGB_LAKE_DIR:-./lake}:/lake:ro
      - ${AGB_RESEARCH_DIR:-./research}:/research
    network_mode: none
    restart: "no"
    # Certification is the heaviest thing this repository runs: fifteen score paths share one
    # feed of every name any of them could trade, which is tens of millions of daily bars held
    # as engine objects at once. Sixteen gigabytes killed it seventy minutes in. This is the
    # workstation's own limit and is not what the server's sizing run measures.
    healthcheck: *no-healthcheck
    mem_limit: 40g
    pids_limit: 1024

volumes:
  pgdata:

# A service on two networks reaches everything on both, so what a service can reach outside
# the stack is decided by the networks other than core it joins.
networks:
  # Every service but `vpn` and `research`. The database lives here and nowhere else. It is
  # internal: Docker gives it no route off the host, so a service on core alone (db, migrate,
  # scheduler, backup, cli, certification-import) cannot reach the internet.
  core:
    internal: true
  # `pipeline`, `execution` and `reconcile`, the services that call outside the stack directly:
  # the pipeline its vendors, the other two the broker. Not the vpn, so that no service with the
  # broker's keys has a route to the proxy.
  outbound:
  # The `ui` alone, and only so that its port can be published: Docker publishes no port from an
  # internal network. Its bridge does no masquerading, so a connection the UI opens to an
  # outside address leaves with the container's private address and no reply finds its way
  # back. That is a second line behind the UI having no reason and no credential to call out,
  # not a guarantee: the host itself, and anything that routes the bridge's subnet back to it,
  # can still answer.
  ui-port:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # Only `vpn` and `bot`: the bot reaches Telegram through the VPN's HTTP proxy.
  egress:
